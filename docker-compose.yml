version: '3.8'

services:
  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: vector-db-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
    volumes:
      - ./:/app
      - /app/__pycache__
      - /app/.venv
    depends_on:
      - chromadb
      - mongodb
      - qdrant
      - redis
    networks:
      - vector-db-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ChromaDB service
  chromadb:
    image: chromadb/chroma:latest
    container_name: vector-db-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=true
      - PERSIST_DIRECTORY=/chroma/chroma_data
      - ANONYMIZED_TELEMETRY=false
    volumes:
      - chroma-data:/chroma/chroma_data
    networks:
      - vector-db-network
    command: uvicorn chromadb.app:app --host 0.0.0.0 --port 8000 --workers 4

  # MongoDB with vector search
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: vector-db-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=vector_db
    volumes:
      - mongodb-data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - vector-db-network
    command: mongod --bind_ip_all --replSet rs0

  # MongoDB replica set initializer
  mongodb-setup:
    image: mongodb/mongodb-atlas-local:latest
    container_name: vector-db-mongodb-setup
    depends_on:
      - mongodb
    networks:
      - vector-db-network
    entrypoint: >
      bash -c "
        echo 'Waiting for MongoDB to start...'
        sleep 10
        mongosh --host mongodb:27017 --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]})'
        echo 'Replica set initialized'
      "

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vector-db-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - vector-db-network
    command: ./qdrant --uri http://qdrant:6333

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: vector-db-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vector-db-network
    command: redis-server --appendonly yes

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: vector-db-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - vector-db-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: vector-db-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - vector-db-network
    depends_on:
      - prometheus

  # Nginx as reverse proxy
  nginx:
    image: nginx:alpine
    container_name: vector-db-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - vector-db-network
    depends_on:
      - app
      - grafana

  # Vector database admin UI
  chroma-admin:
    image: chroma-admin:latest
    container_name: vector-db-chroma-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - CHROMA_API_URL=http://chromadb:8000
    networks:
      - vector-db-network
    depends_on:
      - chromadb

networks:
  vector-db-network:
    driver: bridge
    name: vector-db-network

volumes:
  chroma-data:
    driver: local
  mongodb-data:
    driver: local
  qdrant-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local