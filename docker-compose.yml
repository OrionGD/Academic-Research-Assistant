version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ARAS — Academic Research Assistant System
# Services: redis · backend (API) · backend-workers · ml-service · frontend
#
# Start: docker compose up --build
# Workers run as a separate container so they can be scaled independently.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aras-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Express API) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aras-backend
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      PORT: "5000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URI: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: production
      # Override the local path; the file is copied into the image at /app/serviceAccountKey.json
      GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # curl is installed in backend/Dockerfile via apk
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── BullMQ Workers (separate process) ─────────────────────────────────────
  backend-workers:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aras-workers
    # Override the default CMD (node dist/server.js) from the Dockerfile
    command: node dist/workers/index.js
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URI: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped

  # ─── ML Service (FastAPI) ───────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: aras-ml-service
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # DATABASE_NAME defaults to "aras_db" in config.py; override here if needed
      DATABASE_NAME: aras_db
    restart: unless-stopped
    healthcheck:
      # curl is installed in ml-service/Dockerfile via apt-get
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Frontend (Vite / React → Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked into the JS bundle at build time by Vite.
        # Runtime `environment:` values have NO effect on the Vite bundle.
        # VITE_API_URL must be the URL the *browser* uses to reach the backend.
        VITE_API_URL: http://localhost:5000
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: aras-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── Prometheus (Metrics) ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: aras-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

volumes:
  redis_data:
