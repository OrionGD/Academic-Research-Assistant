version: 1
disable_existing_loggers: false

formatters:
  json:
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    datefmt: "%Y-%m-%dT%H:%M:%S%z"
  
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s - %(filename)s:%(lineno)d"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  simple:
    format: "%(asctime)s - %(levelname)s - %(message)s"
    datefmt: "%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: detailed
    stream: ext://sys.stdout

  console_json:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: /var/log/app/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
    encoding: utf8

  file_json:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: /var/log/app/app.json.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: /var/log/app/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  audit_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: /var/log/app/audit.log
    maxBytes: 10485760  # 10MB
    backupCount: 30
    encoding: utf8

loggers:
  # Application loggers
  app:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
    qualname: app

  app.api:
    level: INFO
    handlers: [console, file]
    propagate: false
    qualname: app.api

  app.database:
    level: INFO
    handlers: [console, file]
    propagate: false
    qualname: app.database

  app.gemini:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false
    qualname: app.gemini

  # Audit logger for security and compliance
  audit:
    level: INFO
    handlers: [audit_file]
    propagate: false
    qualname: audit

  # Third-party loggers
  uvicorn:
    level: INFO
    handlers: [console, file]
    propagate: false
    qualname: uvicorn

  uvicorn.error:
    level: INFO
    handlers: [console, error_file]
    propagate: false
    qualname: uvicorn.error

  uvicorn.access:
    level: INFO
    handlers: [console, file_json]
    propagate: false
    qualname: uvicorn.access

  gunicorn:
    level: INFO
    handlers: [console, file]
    propagate: false
    qualname: gunicorn

  gunicorn.error:
    level: INFO
    handlers: [console, error_file]
    propagate: false
    qualname: gunicorn.error

  gunicorn.access:
    level: INFO
    handlers: [console, file_json]
    propagate: false
    qualname: gunicorn.access

  # Database loggers
  pymongo:
    level: WARNING
    handlers: [file]
    propagate: false
    qualname: pymongo

  motor:
    level: WARNING
    handlers: [file]
    propagate: false
    qualname: motor

  # HTTP clients
  httpx:
    level: WARNING
    handlers: [file]
    propagate: false
    qualname: httpx

  urllib3:
    level: WARNING
    handlers: [file]
    propagate: false
    qualname: urllib3

  requests:
    level: WARNING
    handlers: [file]
    propagate: false
    qualname: requests

root:
  level: INFO
  handlers: [console, file, error_file]
  propagate: true