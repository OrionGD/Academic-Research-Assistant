[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async configuration for async tests
asyncio_mode = auto

# Test markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: integration tests that require external services
    unit: unit tests
    api: API endpoint tests
    db: tests that require database

# Coverage configuration
addopts = 
    -v
    --strict-markers
    --disable-warnings
    -ra
    --tb=short
    
    # Coverage reporting (uncomment when you install pytest-cov)
    # --cov=backend/app
    # --cov-report=term-missing
    # --cov-report=html:coverage_html
    # --cov-report=xml:coverage.xml
    # --cov-fail-under=80
    
    # Test selection defaults
    -m "not slow and not integration"

# Python path - helps pytest find your modules
pythonpath = 
    .
    backend/

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    default

# Test output formatting
console_output_style = classic

# Test discovery
norecursedirs = 
    .git
    .venv
    venv
    env
    .env
    node_modules
    __pycache__
    *.egg-info
    .pytest_cache
    build
    dist
    coverage_html