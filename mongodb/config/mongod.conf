# MongoDB Configuration File
# Version: 7.0
# Environment: Production

# Where and how to store data
storage:
  dbPath: /data/db
  journal:
    enabled: true
    commitIntervalMs: 100
  directoryPerDB: true
  syncPeriodSecs: 60
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 4
      journalCompressor: snappy
      directoryForIndexes: true
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 65536
  wireObjectCheck: false
  ipv6: false
  tls:
    mode: disabled
    certificateKeyFile: /etc/ssl/mongodb.pem
    CAFile: /etc/ssl/ca.pem

# Process management
processManagement:
  fork: false
  pidFilePath: /var/run/mongodb/mongod.pid
  timeZoneInfo: /usr/share/zoneinfo

# Security options
security:
  authorization: enabled
  keyFile: /data/configdb/keyfile
  clusterAuthMode: keyFile
  javascriptEnabled: true
  enableEncryption: false
  redactClientLogData: false

# Operation profiling
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100
  slowOpSampleRate: 1.0

# Replication options
replication:
  replSetName: rs0
  oplogSizeMB: 10240
  enableMajorityReadConcern: true
  secondaryIndexPrefetch: all

# Sharding options
sharding:
  clusterRole: shardsvr
  archiveMovedChunks: false

# Storage engine options
storageEngine:
  wiredTiger:

# Audit log
auditLog:
  destination: file
  format: JSON
  path: /data/db/audit.log
  filter: '{ atype: { $in: ["createCollection", "dropCollection", "createIndex", "dropIndex", "createUser", "dropUser"] } }'

# Set parameter options
setParameter:
  enableLocalhostAuthBypass: false
  authenticationMechanisms: SCRAM-SHA-256
  logComponentVerbosity:
    command: 1
    replication: 1
    storage: 1
    network: 0
    query: 0
  wiredTigerEngineRuntimeConfig: cache_size=4G
  transactionLifetimeLimitSeconds: 300
  maxTransactionLockRequestTimeoutMillis: 5
  cursorTimeoutMillis: 600000
