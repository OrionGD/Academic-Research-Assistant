# MongoDB Sharding Router Configuration
# Version: 7.0
# Environment: Production

# Where to store configuration
sharding:
  configDB: config-server-1:27019,config-server-2:27019,config-server-3:27019

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 65536
  wireObjectCheck: false
  serviceExecutor: synchronous

# Process management
processManagement:
  fork: false
  pidFilePath: /var/run/mongodb/mongos.pid

# Security options
security:
  keyFile: /data/configdb/keyfile
  clusterAuthMode: keyFile
  authorization: enabled

# Audit log
auditLog:
  destination: file
  format: JSON
  path: /data/db/audit.log
  filter: '{ atype: { $in: ["authenticate", "createCollection", "dropCollection", "createIndex", "dropIndex"] } }'

# Set parameter options
setParameter:
  enableLocalhostAuthBypass: false
  authenticationMechanisms: SCRAM-SHA-256
  logComponentVerbosity:
    command: 1
    sharding: 1
    network: 0
  mongosShutdownTimeoutMillisForStepDown: 60000
  writePeriodicNoops: true
  migrateCloneInsertionBatchSize: 1000
  chunkMigrationConcurrency: 1

# Balancer settings
balancer:
  mode: auto
  stopped: false
  maxChunkSizeBytes: 67108864
  waitForDelete: true
  window: "02:00-04:00"

# Database settings
setParameter:
  rangeDeleterBatchSize: 128
  skipShardingConfigurationChecks: false
