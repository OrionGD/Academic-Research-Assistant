version: '3.8'

services:
  mongo-primary:
    image: mongo:7.0
    container_name: mongo-primary
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: aras
    volumes:
      - mongo-primary-data:/data/db
      - mongo-primary-config:/data/configdb
      - ./scripts:/docker-entrypoint-initdb.d
      - ./config/mongod.conf:/etc/mongo/mongod.conf
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--config", "/etc/mongo/mongod.conf"]
    networks:
      - mongo-cluster
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-secondary-1:
    image: mongo:7.0
    container_name: mongo-secondary-1
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongo-secondary-1-data:/data/db
      - mongo-secondary-1-config:/data/configdb
      - ./config/mongod.conf:/etc/mongo/mongod.conf
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--config", "/etc/mongo/mongod.conf"]
    networks:
      - mongo-cluster
    depends_on:
      - mongo-primary

  mongo-secondary-2:
    image: mongo:7.0
    container_name: mongo-secondary-2
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongo-secondary-2-data:/data/db
      - mongo-secondary-2-config:/data/configdb
      - ./config/mongod.conf:/etc/mongo/mongod.conf
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--config", "/etc/mongo/mongod.conf"]
    networks:
      - mongo-cluster
    depends_on:
      - mongo-primary

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: adminpassword
      ME_CONFIG_MONGODB_SERVER: mongo-primary
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - mongo-cluster
    depends_on:
      - mongo-primary

networks:
  mongo-cluster:
    driver: bridge

volumes:
  mongo-primary-data:
  mongo-primary-config:
  mongo-secondary-1-data:
  mongo-secondary-1-config:
  mongo-secondary-2-data:
  mongo-secondary-2-config:
